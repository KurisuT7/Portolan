name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: "1.27.x"
  NODE_VERSION: "24"
  IMAGE: ghcr.io/kurisut7/portolan

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Check that the tag matches the changelog
        run: grep -q "^## \[${GITHUB_REF_NAME#v}\] - " CHANGELOG.md
      - run: go test ./...
      - run: scripts/build-release.sh "$GITHUB_REF_NAME"
      - name: Check reported versions
        run: |
          for arch in amd64 arm64; do file "release/bin/$arch/portolan-panel" | grep -q "statically linked"; done
          test "$(release/bin/amd64/portolan-panel version)" = "$GITHUB_REF_NAME"
          test "$(release/bin/amd64/portolan-agent version)" = "$GITHUB_REF_NAME"
      - name: Choose image tags
        id: tags
        run: |
          version=${GITHUB_REF_NAME#v}
          tags="$IMAGE:$version"
          # Pre-releases such as v0.2.0-rc.1 do not move the latest tag.
          case "$version" in *-*) ;; *) tags="$tags,$IMAGE:latest" ;; esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the container image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.description=Portolan control panel
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v heading="## [${GITHUB_REF_NAME#v}]" \
            'index($0, heading) == 1 { found = 1; next } found && (/^## \[/ || /^\[[^]]*\]: /) { exit } found' \
            CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag $prerelease --title "Portolan $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" release/*.tar.gz release/install-panel.sh release/SHA256SUMS
